<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>MarocMarket · Bienvenue</title>
  <style>
    /* Reset & base mobile-first – ultra simple, sans aucune icône */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background-color: #b85e0e;
      background: linear-gradient(145deg, #a64d0c 0%, #c96f1a 100%);
      background-color: #b85e0e;
      padding: 1.5rem;
      margin: 0;
    }

    .welcome-card {
      max-width: 480px;
      width: 100%;
      background: transparent;
      padding: 1.8rem 1.2rem 2.2rem;
      text-align: center;
      color: #fff7e6;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0.4rem 0 0.1rem;
      color: #ffefd6;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
      word-break: break-word;
    }

    .subhead {
      font-size: 1.1rem;
      font-weight: 400;
      margin-bottom: 1.6rem;
      color: #ffeac2;
      letter-spacing: 0.5px;
      opacity: 0.9;
    }

    .message-bienvenue {
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.4;
      margin: 1.6rem 0 1.2rem;
      padding: 0.8rem 0.2rem;
      color: #fff5e0;
      word-break: break-word;
    }

    .message-bienvenue span {
      font-weight: 300;
      font-size: 0.9em;
      display: block;
      margin-top: 0.2rem;
    }

    .highlight-lancement {
      font-weight: 500;
      font-size: 1.4rem;
      margin: 1.2rem 0 1rem;
      color: #ffedc0;
      letter-spacing: 0.3px;
      padding: 0.3rem 0;
    }

    .remerciement {
      font-size: 1.35rem;
      font-weight: 400;
      margin-top: 2rem;
      padding-top: 1.2rem;
      border-top: 2px solid rgba(255, 215, 140, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.3rem 0.6rem;
      color: #ffebcd;
      letter-spacing: 0.2px;
    }

    .remerciement strong {
      font-weight: 600;
      color: #ffdca8;
    }

    @media (max-width: 380px) {
      .welcome-card {
        padding: 1.2rem 0.8rem 1.8rem;
      }
      h1 {
        font-size: 2.2rem;
      }
      .message-bienvenue {
        font-size: 1.25rem;
        padding: 0.6rem 0;
      }
      .highlight-lancement {
        font-size: 1.2rem;
      }
      .remerciement {
        font-size: 1.1rem;
      }
    }

    @media (min-width: 600px) {
      .welcome-card {
        padding: 2.5rem 2rem 3rem;
      }
      h1 {
        font-size: 3.2rem;
      }
      .message-bienvenue {
        font-size: 1.8rem;
      }
      .highlight-lancement {
        font-size: 1.7rem;
      }
      .remerciement {
        font-size: 1.6rem;
      }
    }

    .welcome-card * {
      -webkit-tap-highlight-color: transparent;
    }

    .divider-light {
      width: 60px;
      height: 2px;
      background: rgba(255, 215, 140, 0.3);
      margin: 0.6rem auto 0.4rem;
    }

    .footer-note {
      margin-top: 1.8rem;
      font-size: 0.75rem;
      opacity: 0.6;
      letter-spacing: 0.3px;
      border-top: 1px solid rgba(255,215,140,0.1);
      padding-top: 0.8rem;
      color: #ffebcd;
    }
  </style>
</head>
<body>
  <div class="welcome-card" role="main" aria-label="Page d'accueil MarocMarket">
    
    <h1>Maroc<span style="font-weight:300;">Market</span></h1>
    <div class="subhead">marketplace</div>
    
    <div class="message-bienvenue">
      Bienvenue sur MarocMarket
      <span>Votre marketplace pour acheter et vendre en ligne.</span>
    </div>
    
    <div class="highlight-lancement">
      Lancement du site aujourd'hui
    </div>
    
    <div class="divider-light" aria-hidden="true"></div>
    
    <div class="remerciement">
      <span><strong>Merci</strong> de faire partie de l'aventure</span>
    </div>
    
    <div class="footer-note">
      MarocMarket - Créé Par M.Seddik ELidrissi
    </div>
  </div>
</body>
</html>
